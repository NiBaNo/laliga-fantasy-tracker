<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Tracker</title>

    <link/main.css
    <link/layout.css
    <link rel="stylesheet" hrefody>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                ⚽ Fantasy Tracker
            </div>

            <nav>
                #🏠 Dashboard</a>
                <a� Plantilla</a>
                <a href="#">📈
                <a� Historial</a>
                <a️ Configuració</a>
            </nav>

        </aside>

        <main class="content">

            <header class="topbar">

                <h1>Dashboard</h1>

                <button class="btn-primary">
                    🔄 Actualitzar mercat
                </button>

            </header>

            <section class="stats-grid">

                <div class="stat-card">
                    <h3>Patrimoni</h3>
                    <p>267 M€</p>
                </div>

                <div class="stat-card">
                    <h3>Saldo</h3>
                    <p>37 M€</p>
                </div>

                <div class="stat-card">
                    <h3>Benefici latent</h3>
                    <p class="positive">+18 M€</p>
                </div>

                <div class="stat-card">
                    <h3>Jugadors</h3>
                    <p>14</p>
                </div>

            </section>

            <section class="players-section">

                <h2>Plantilla actual</h2>

                <div class="players-grid">

                    <!-- AGIRREZABALA -->

                    <div class="player-card">

                        <img src="https://via.placeholder.com/120"
                             alt="Agirrezabala">

                        <h3>Agirrezabala</h3>

                        <p>Racing</p>

                        <div class="player-stats">
                            <span>Compra</span>
                            <strong>2.9M</strong>
                        </div>

                        <div class="player-stats">
                            <span>Actual</span>
                            <strong>5.4M</strong>
                        </div>

                        <div class="player-stats">
                            <span>Benefici</span>
                            <strong class="positive">
                                +2.5M
                            </strong>
                        </div>

                    </div>

                    <!-- KOSKI -->

                    <div class="player-card">

                        <img src="https://via.placeholder.com/120"
                             alt="Koski">

                        <h3>Koski</h3>

                        <p>Alavés</p>

                        <div class="player-stats">
                            <span>Compra</span>
                            <strong>1M</strong>
                        </div>

                        <div class="player-stats">
                            <span>Actual</span>
                            <strong>2M</strong>
                        </div>

                        <div class="player-stats">
                            <span>Benefici</span>
                            <strong class="positive">
                                +1M
                            </strong>
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
